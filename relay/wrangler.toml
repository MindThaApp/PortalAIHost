name = "portal-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# No account id and no secrets live in this repo: `wrangler deploy` takes the account from the person who runs it.

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

# SQLite-backed Durable Objects are the ones available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limiter"]

[observability]
enabled = false
